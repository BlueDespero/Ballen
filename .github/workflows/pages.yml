# Publishes site/ (the privacy policy Google Play links to) with GitHub Pages,
# on every push to master that changes it. Only site/ is published, not docs/.
# Needs Pages turned on once: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [master]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
