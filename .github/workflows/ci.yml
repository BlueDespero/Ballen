# Tests every pull request and every push to master: GUT and the harness, then
# a Web export run through the Playwright tests. On master, the tested build is
# also pushed to itch.io. Deploy needs the repository secret BUTLER_API_KEY and
# variable ITCH_GAME (e.g. "user/ballen"); see CLAUDE.md, "CI".
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  GODOT_RELEASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/godot-download ~/godot
          cd ~/godot-download
          curl -fsSL -o "$zip" "$GODOT_RELEASE_URL/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_RELEASE_URL/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # Registers class_names and GUT's own; its exit code is not reliable, so
      # GUT's run below is the check (a script that fails to load fails it).
      - name: Import project
        run: godot --headless --path . --import || echo "Import exited with $?; GUT will catch real failures."

      - name: GUT tests
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit

      - name: AI-vs-AI harness
        run: godot --headless --path . -s harness/run_harness.gd -- --matches 20 --seed 1

  # Exports the web build and runs the Playwright tests on it, so a PR shows
  # web breakage before it merges. On master, the tested build goes to deploy.
  web:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/godot-download ~/godot
          cd ~/godot-download
          curl -fsSL -o "$zip" "$GODOT_RELEASE_URL/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_RELEASE_URL/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # Only the web templates are kept: the full .tpz is over 1 GB.
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-web

      - name: Install export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/templates-download "$dest"
          cd ~/templates-download
          curl -fsSL -o "$tpz" "$GODOT_RELEASE_URL/$tpz"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_RELEASE_URL/SHA512-SUMS.txt"
          grep " $tpz\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q -j -o "$tpz" 'templates/web_*' 'templates/version.txt' -d "$dest"
          rm "$tpz"
          ls "$dest"

      - name: Import project
        run: godot --headless --path . --import || echo "Import exited with $?."

      # 0.2.0 becomes 0.2.0+<short sha>, shown in the main menu and on itch.io.
      - name: Stamp version
        id: version
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short="${SHA::7}"
          sed -i -E "s/^config\/version=\"([^\"+]+)\"/config\/version=\"\1+${short}\"/" project.godot
          version="$(sed -n -E 's/^config\/version="([^"]+)"/\1/p' project.godot)"
          case "$version" in
            *+"${short}") ;;
            *) echo "::error::Could not stamp config/version in project.godot (got '$version')."; exit 1 ;;
          esac
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html && test -f build/web/index.pck && test -f build/web/index.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-test/package-lock.json

      - name: Playwright tests
        working-directory: web-test
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit firefox
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-test/playwright-report/
            web-test/test-results/
          retention-days: 14

      - name: Upload web build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-itch
      cancel-in-progress: false
    steps:
      - name: Check itch.io settings
        env:
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          missing=0
          if [ -z "$ITCH_GAME" ]; then
            echo "::error::Repository variable ITCH_GAME is not set. Add it (e.g. user/ballen) under Settings > Secrets and variables > Actions > Variables."
            missing=1
          fi
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::Repository secret BUTLER_API_KEY is not set. Create an itch.io API key and add it under Settings > Secrets and variables > Actions > Secrets."
            missing=1
          fi
          exit "$missing"

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Install butler
        run: |
          mkdir -p ~/butler
          curl -fsSL -o ~/butler/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o ~/butler/butler.zip -d ~/butler
          chmod +x ~/butler/butler
          echo "$HOME/butler" >> "$GITHUB_PATH"
          ~/butler/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          VERSION: ${{ needs.web.outputs.version }}
        run: butler push build/web "$ITCH_GAME:html5" --userversion "$VERSION"
